[tool.uv]
package = false

[tool.uv.sources]
modal-dojo = { path = ".dojo", editable = true }

[dependency-groups]
test = ["pytest>=9", "pytest-asyncio>=1.3", "pytest-xdist[psutil]>=3.8"]
